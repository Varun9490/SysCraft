[package]
name = "sim-kernel"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fixed-memory queuing physics for the SysCraft simulation tick"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
